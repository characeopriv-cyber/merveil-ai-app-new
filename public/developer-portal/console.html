<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07090f">
  <meta name="application-name" content="Merveil AI">
  <title>Merveil AI — Developer Console</title>
  <link rel="icon" type="image/svg+xml" href="/merveil-mark.svg?v=1">
  <link rel="shortcut icon" href="/merveil-mark.svg?v=1">
  <link rel="stylesheet" href="/developer-portal/console.css">
  <link rel="stylesheet" href="/developer-portal/developer-enhancements.css?v=2">
</head>
<body>
  <div id="app"><div class="loading">Loading Merveil Developer Console…</div></div>
  <script>
    // Safe public bootstrap fallback. This is a Supabase publishable key, never a service-role key.
    window.__MERVEIL_DEVELOPER_CONFIG__ = {
      data: {
        supabase_url: "https://dixfybqlepticyudikuz.supabase.co",
        supabase_publishable_key: "sb_publishable_zOtxw1q_OCpiTunktzypw_14pQnQOh",
        api_base_url: "/api/v1"
      }
    };
    // Older cached console.js builds request this endpoint directly. Return the safe public config locally.
    (() => {
      const nativeFetch = window.fetch.bind(window);
      const fallback = window.__MERVEIL_DEVELOPER_CONFIG__;
      window.fetch = (input, init) => {
        const url = typeof input === "string" ? input : input?.url || "";
        if (url === "/api/v1/developer/config" || url.endsWith("/api/v1/developer/config")) {
          return Promise.resolve(new Response(JSON.stringify(fallback), {
            status: 200,
            headers: { "content-type": "application/json; charset=utf-8", "cache-control": "no-store" }
          }));
        }
        return nativeFetch(input, init);
      };
    })();
  </script>
  <script type="module" src="/developer-portal/console.js"></script>
  <script type="module" src="/developer-portal/onboarding-panel.js"></script>
  <script type="module" src="/developer-portal/commercial-panel.js"></script>
  <script type="module" src="/developer-portal/team-panel.js"></script>
  <script type="module" src="/developer-portal/webhook-deliveries.js"></script>
  <script type="module" src="/developer-portal/developer-enhancements.js?v=2"></script>
</body>
</html>
