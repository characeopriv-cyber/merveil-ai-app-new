<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Merveil Developer Console</title><style>body{margin:0;background:#060914;color:#f5f8ff;font:14px Inter,system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;padding:16px;border:1px solid #223451;border-radius:18px;background:#0b1020}.brand{color:#39d7ff;font-weight:900;letter-spacing:.12em;font-size:11px}.tabs{display:flex;gap:8px;margin:14px 0}.tabs button,.project button{background:#111b30;border:1px solid #29405d;color:#e9f4ff;padding:10px 14px;border-radius:10px;font-weight:800}.primary{background:#39d7ff!important;color:#031018!important;border:0!important}.grid{display:grid;grid-template-columns:280px 1fr;gap:14px}.panel{border:1px solid #1b2740;border-radius:16px;background:#0b1020;padding:16px}.project{display:flex;justify-content:space-between;gap:8px;padding:11px;border:1px solid #1b2740;border-radius:10px;margin:8px 0}.project small{display:block;color:#8d9ab4;margin-top:3px}.muted{color:#8d9ab4}.workspace{display:grid;grid-template-columns:180px 1fr;gap:12px}.files button{display:block;width:100%;text-align:left;margin:6px 0}.field{display:grid;gap:6px;margin:10px 0}.field input,.field textarea,.field select{background:#070c17;border:1px solid #29405d;color:#fff;border-radius:9px;padding:10px}.field textarea{min-height:180px;font-family:ui-monospace,monospace}.actions{display:flex;gap:8px;flex-wrap:wrap}.log{white-space:pre-wrap;background:#070c17;border:1px solid #1b2740;border-radius:10px;padding:12px;min-height:80px}.chat{height:180px;overflow:auto;border:1px solid #1b2740;border-radius:10px;padding:10px}.row{display:flex;gap:8px}.row input{flex:1}@media(max-width:760px){.grid,.workspace{grid-template-columns:1fr}}</style></head><body><main><section class="top"><div><div class="brand">MERVEIL AI · DEVELOPER CONSOLE · BY IVONIX</div><h1 id="workspaceTitle">Developer Workspace</h1><div class="muted">Idea → Build → Test → Deploy → Impact</div></div><div class="actions"><button onclick="location.href='/'">Entry</button><button onclick="show('providers')">Infrastructure</button></div></section><div class="tabs"><button class="primary" onclick="show('projects')">Projects</button><button onclick="show('workspace')">Workspace</button></div><section class="grid"><aside class="panel" id="projects"><div class="actions"><button class="primary" onclick="newProject()">＋ New project</button></div><div id="projectList" class="muted">Loading projects…</div></aside><section class="panel" id="workspace" hidden><div class="workspace"><div class="panel files"><b>Files</b><div id="fileList" class="muted">No project selected.</div></div><div><div class="field"><label>Path</label><input id="filePath" value="index.html"></div><div class="field"><label>Code</label><textarea id="fileCode"></textarea></div><div class="actions"><button class="primary" onclick="saveFile()">Save</button><button onclick="build('build')">Build</button><button onclick="build('test')">Test</button><button onclick="cloudflare()">Deploy</button></div><div class="field"><label>Project Brief</label><input id="briefTitle" placeholder="Project title"><textarea id="briefSummary" placeholder="What are you building?"></textarea><select id="briefVisibility"><option value="private">Private</option><option value="public">Public</option></select><button onclick="saveBrief()">Save Brief</button></div><div class="field"><label>Merveil Intelligence</label><div id="chatMessages" class="chat"></div><div class="row"><input id="chatInput" placeholder="Tell Merveil what to build..."><button class="primary" onclick="sendChat()">Send</button></div></div><div class="field"><label>Voice-to-Build</label><div class="row"><input id="voiceText" placeholder="Describe the product or change"><button id="voiceButton" onclick="startVoice()">Speak</button><button onclick="voiceBuildText()">Plan</button></div><div id="voiceStatus" class="muted">Ready</div><div id="voicePlan" class="log"></div></div><div id="workspaceLog" class="log">Ready.</div></div></div></section><section class="panel" id="providers" hidden><h2>Infrastructure</h2><div class="actions"><button onclick="databases()">Databases</button><button onclick="deploymentStatus()">Deployment status</button></div><div id="providerOutput" class="log">Choose an infrastructure action.</div></section></section></main><script type="module" src="/developer/app.js"></script></body></html>
